<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pokemon Radical Red - GBA Emulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #game-container {
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            max-width: 1000px;
            width: 95%;
            max-height: 95vh;
            overflow-y: auto;
        }
        h1 {
            margin-bottom: 10px;
            color: #00d4ff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            font-size: 24px;
        }
        p {
            margin-bottom: 15px;
            font-size: 14px;
        }
        #loading-progress {
            font-size: 14px;
            margin: 15px 0;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: inline-block;
            border: 2px solid #00d4ff;
        }
        #error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.2);
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            text-align: left;
            font-size: 13px;
        }
        #emulator-container {
            margin-top: 15px;
            display: none;
        }
        #canvas {
            max-width: 100%;
            width: auto;
            height: auto;
            border: 3px solid #00d4ff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            background: #000;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
            margin: 0 auto;
        }
        .controls {
            margin-top: 15px;
            font-size: 11px;
            color: #ccc;
        }
        .status {
            margin-top: 10px;
            font-size: 12px;
            color: #00d4ff;
        }
        #file-input {
            display: none;
        }
        .file-upload {
            margin-top: 15px;
            padding: 12px;
            background: rgba(0, 212, 255, 0.1);
            border: 2px dashed #00d4ff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }
        .file-upload:hover {
            background: rgba(0, 212, 255, 0.2);
        }
        .file-upload p {
            margin: 0;
        }
        .debug-info {
            margin-top: 15px;
            font-size: 10px;
            color: #888;
            text-align: left;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 5px;
            max-height: 120px;
            overflow-y: auto;
            font-family: monospace;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>🎮 Pokemon Radical Red</h1>
        <p>Game Boy Advance Emulator</p>
        <div id="loading-progress">Loading Emulators.js...</div>
        <div id="error"></div>
        <div id="emulator-container">
            <canvas id="canvas" width="240" height="160"></canvas>
            <div class="controls">
                <p><strong>Keyboard Controls:</strong></p>
                <p>Arrow Keys: D-Pad | Z/X: B/A | A/S: L/R | Enter: Start | Space: Select</p>
            </div>
            <div class="file-upload" onclick="document.getElementById('file-input').click();">
                <p>📁 Click to load Pokemon Radical Red (.gba file)</p>
                <input type="file" id="file-input" accept=".gba,.zip,.rar,.7z" />
            </div>
            <div class="status" id="status"></div>
            <div class="debug-info" id="debug-info"></div>
        </div>
    </div>

    <script src="https://js.emulators.lol/gba.js"></script>

    <script>
        const DEBUG = true;
        let emulator = null;
        let EJS_INSTANCE = null;
        
        function debugLog(msg) {
            if (DEBUG) {
                console.log('[DEBUG]', msg);
                const debugDiv = document.getElementById('debug-info');
                if (debugDiv) {
                    const timestamp = new Date().toLocaleTimeString();
                    debugDiv.innerHTML += `[${timestamp}] ${msg}<br>`;
                    debugDiv.scrollTop = debugDiv.scrollHeight;
                }
            }
        }

        class EmulatorsJSWrapper {
            constructor(canvas) {
                this.canvas = canvas;
                this.isRunning = false;
                this.rom = null;
                debugLog('Emulators.js Wrapper initialized');
            }

            async load(romBlob) {
                return new Promise((resolve, reject) => {
                    try {
                        debugLog('Loading ROM: ' + romBlob.size + ' bytes');
                        
                        const reader = new FileReader();
                        
                        reader.onload = (e) => {
                            try {
                                this.rom = e.target.result;
                                debugLog('ROM read: ' + this.rom.byteLength + ' bytes');
                                
                                if (!this.validateROM(this.rom)) {
                                    throw new Error('Invalid GBA ROM');
                                }
                                
                                debugLog('ROM validated');
                                this.run();
                                resolve();
                            } catch (err) {
                                debugLog('Error in onload: ' + err.message);
                                reject(err);
                            }
                        };
                        
                        reader.onerror = () => {
                            debugLog('FileReader error');
                            reject(new Error('Failed to read file'));
                        };
                        
                        reader.readAsArrayBuffer(romBlob);
                    } catch (err) {
                        debugLog('Error in load: ' + err.message);
                        reject(err);
                    }
                });
            }

            validateROM(romData) {
                debugLog('Validating ROM...');
                const size = romData.byteLength;
                
                if (size < 32 * 1024) {
                    debugLog('ERROR: ROM too small');
                    return false;
                }
                
                if (size > 64 * 1024 * 1024) {
                    debugLog('ERROR: ROM too large');
                    return false;
                }
                
                debugLog('ROM size valid: ' + (size / 1024 / 1024).toFixed(2) + ' MB');
                return true;
            }

            run() {
                try {
                    debugLog('Initializing Emulators.js...');
                    
                    if (typeof window.EJS_emulator === 'undefined') {
                        debugLog('Creating new EJS_emulator instance');
                        
                        window.EJS_player = '#canvas';
                        window.EJS_core = 'gba';
                        window.EJS_pathtodata = 'https://js.emulators.lol/data/';
                        
                        // Convert ArrayBuffer to data URL
                        const blob = new Blob([this.rom], { type: 'application/octet-stream' });
                        const url = URL.createObjectURL(blob);
                        window.EJS_gameUrl = url;
                        
                        debugLog('ROM blob URL created');
                        
                        // Initialize emulator
                        EJS_INSTANCE = new window.EJS({
                            element: document.getElementById('canvas'),
                            gameUrl: url,
                            core: 'gba'
                        });
                        
                        debugLog('✓ EJS instance created and game loaded');
                        
                        document.getElementById("status").innerHTML = `
                            ✓ Game Running<br>
                            ROM: Pokemon Radical Red<br>
                            Status: Ready to play
                        `;
                        
                        this.setupControls();
                    }
                } catch (err) {
                    debugLog('ERROR in run: ' + err.message);
                    throw err;
                }
            }

            setupControls() {
                debugLog('Setting up controls');
                
                const keyMap = {
                    'ArrowUp': 'ArrowUp',
                    'ArrowDown': 'ArrowDown',
                    'ArrowLeft': 'ArrowLeft',
                    'ArrowRight': 'ArrowRight',
                    'z': 'z',
                    'x': 'x',
                    'a': 'a',
                    's': 's',
                    'Enter': 'Enter',
                    ' ': ' '
                };
                
                document.addEventListener('keydown', (e) => {
                    if (keyMap[e.key.toLowerCase()]) {
                        debugLog('Key down: ' + e.key);
                    }
                });
                
                document.addEventListener('keyup', (e) => {
                    if (keyMap[e.key.toLowerCase()]) {
                        debugLog('Key up: ' + e.key);
                    }
                });
            }
        }

        async function loadROMFromFile(romBlob) {
            try {
                debugLog('Load ROM from file: ' + romBlob.name + ' (' + romBlob.size + ' bytes)');
                
                if (!emulator) {
                    emulator = new EmulatorsJSWrapper(document.getElementById('canvas'));
                }

                const progressElement = document.getElementById("loading-progress");
                if (progressElement) {
                    progressElement.textContent = "Processing ROM file...";
                }
                
                await emulator.load(romBlob);

                if (progressElement) {
                    progressElement.textContent = "Game Loaded!";
                }
                
                document.getElementById("emulator-container").style.display = "block";
                document.getElementById("error").style.display = "none";

                debugLog('✓ ROM loaded successfully');

            } catch (error) {
                debugLog('ERROR: ' + error.message);
                console.error("Error:", error);
                
                const errorDiv = document.getElementById("error");
                errorDiv.style.display = "block";
                errorDiv.innerHTML = `
                    <strong>Error Loading ROM:</strong><br>
                    ${error.message}<br>
                    <small>Check debug logs below for more info</small>
                `;
                
                const progressElement = document.getElementById("loading-progress");
                if (progressElement) {
                    progressElement.textContent = "Error loading ROM";
                }
            }
        }

        async function initEmulator() {
            try {
                debugLog('Initializing emulator...');
                debugLog('Checking for Emulators.js...');
                
                // Wait for Emulators.js to load
                let waitCount = 0;
                while (typeof window.EJS === 'undefined' && waitCount < 100) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    waitCount++;
                }
                
                if (typeof window.EJS === 'undefined') {
                    debugLog('WARNING: Emulators.js failed to load from CDN');
                    throw new Error('Emulators.js library failed to load');
                }
                
                debugLog('✓ Emulators.js loaded successfully');
                
                document.getElementById("loading-progress").innerHTML = `
                    <p>✓ Emulator Ready</p>
                    <small>Click below to load your Pokemon Radical Red (.gba) file</small>
                `;
                
                document.getElementById("emulator-container").style.display = "block";
                
            } catch (error) {
                debugLog('ERROR in initEmulator: ' + error.message);
                const errorDiv = document.getElementById("error");
                errorDiv.style.display = "block";
                errorDiv.innerHTML = `
                    <strong>Emulator Initialization Error:</strong><br>
                    ${error.message}<br>
                    <small>Try loading your GBA ROM file - emulator may load on first use</small>
                `;
                
                document.getElementById("emulator-container").style.display = "block";
            }

            // Setup file upload handler
            debugLog('Setting up file upload handler');
            document.getElementById('file-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    debugLog('File selected: ' + file.name);
                    if (file.name.toLowerCase().endsWith('.gba')) {
                        loadROMFromFile(file);
                    } else {
                        const errorDiv = document.getElementById("error");
                        errorDiv.style.display = "block";
                        errorDiv.innerHTML = 'Please select a valid .gba ROM file';
                        debugLog('ERROR: Invalid file type: ' + file.name);
                    }
                }
            });
        }

        // Initialize when page loads
        debugLog('Page loading...');
        window.addEventListener('load', () => {
            debugLog('DOMContentLoaded');
            initEmulator();
        });
    </script>
</body>
</html>
