<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pokemon Radical Red - GBA Emulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            max-width: 900px;
            width: 90%;
        }
        h1 {
            margin-bottom: 20px;
            color: #00d4ff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }
        #loading-progress {
            font-size: 16px;
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: inline-block;
            border: 2px solid #00d4ff;
        }
        #error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            text-align: left;
        }
        #emulator-container {
            margin-top: 20px;
            display: none;
        }
        canvas {
            max-width: 100%;
            border: 3px solid #00d4ff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            background: #000;
            image-rendering: pixelated;
        }
        .controls {
            margin-top: 20px;
            font-size: 12px;
            color: #ccc;
        }
        .status {
            margin-top: 10px;
            font-size: 14px;
            color: #00d4ff;
        }
        #file-input {
            display: none;
        }
        .file-upload {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 212, 255, 0.1);
            border: 2px dashed #00d4ff;
            border-radius: 8px;
            cursor: pointer;
        }
        .file-upload:hover {
            background: rgba(0, 212, 255, 0.2);
        }
        .debug-info {
            margin-top: 20px;
            font-size: 11px;
            color: #888;
            text-align: left;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 5px;
            max-height: 150px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>🎮 Pokemon Radical Red</h1>
        <p>Game Boy Advance Emulator</p>
        <div id="loading-progress">Initializing emulator...</div>
        <div id="error"></div>
        <div id="emulator-container">
            <canvas id="canvas" width="240" height="160"></canvas>
            <div class="controls">
                <p><strong>Keyboard Controls:</strong></p>
                <p>Arrow Keys: D-Pad | Z/X: B/A | A/S: L/R | Enter: Start | Space: Select</p>
            </div>
            <div class="file-upload" onclick="document.getElementById('file-input').click();">
                <p>📁 Click to load Pokemon Radical Red (.gba file)</p>
                <input type="file" id="file-input" accept=".gba,.zip,.rar" />
            </div>
            <div class="status" id="status"></div>
            <div class="debug-info" id="debug-info"></div>
        </div>
    </div>

    <script src="https://s3.amazonaws.com/mgba/mgba.js"></script>

    <script>
        const DEBUG = true;
        
        function debugLog(msg) {
            if (DEBUG) {
                console.log('[DEBUG]', msg);
                const debugDiv = document.getElementById('debug-info');
                if (debugDiv) {
                    const timestamp = new Date().toLocaleTimeString();
                    debugDiv.innerHTML += `[${timestamp}] ${msg}<br>`;
                    debugDiv.scrollTop = debugDiv.scrollHeight;
                }
            }
        }

        let emulator = null;

        // GBA Emulator wrapper
        class GBAEmulator {
            constructor(canvas) {
                this.canvas = canvas;
                this.rom = null;
                this.isRunning = false;
                debugLog('GBA Emulator instance created');
            }

            async load(romBlob) {
                return new Promise((resolve, reject) => {
                    try {
                        debugLog('Starting GBA ROM load: ' + romBlob.size + ' bytes');
                        const reader = new FileReader();
                        
                        reader.onload = (e) => {
                            try {
                                this.rom = e.target.result;
                                debugLog('ROM loaded into memory: ' + this.rom.byteLength + ' bytes');
                                
                                if (!this.validateROM()) {
                                    throw new Error('Invalid GBA ROM file format');
                                }
                                
                                debugLog('ROM validation passed');
                                this.isRunning = true;
                                this.run();
                                resolve();
                            } catch (err) {
                                debugLog('Error in reader.onload: ' + err.message);
                                reject(err);
                            }
                        };
                        
                        reader.onerror = () => {
                            const errMsg = 'FileReader error: ' + reader.error;
                            debugLog(errMsg);
                            reject(new Error(errMsg));
                        };
                        
                        reader.onprogress = (e) => {
                            if (e.lengthComputable) {
                                const pct = Math.round((e.loaded / e.total) * 100);
                                debugLog('FileReader progress: ' + pct + '%');
                            }
                        };
                        
                        debugLog('Starting FileReader.readAsArrayBuffer');
                        reader.readAsArrayBuffer(romBlob);
                    } catch (err) {
                        debugLog('Error in load(): ' + err.message);
                        reject(err);
                    }
                });
            }

            validateROM() {
                debugLog('Validating GBA ROM...');
                
                // GBA ROMs are typically 16-32 MB
                if (this.rom.byteLength < 32 * 1024) {
                    debugLog('ERROR: ROM too small: ' + this.rom.byteLength);
                    return false;
                }

                if (this.rom.byteLength > 64 * 1024 * 1024) {
                    debugLog('ERROR: ROM too large: ' + this.rom.byteLength);
                    return false;
                }

                debugLog('GBA ROM size valid: ' + (this.rom.byteLength / 1024 / 1024).toFixed(2) + ' MB');
                return true;
            }

            run() {
                try {
                    debugLog('Initializing mGBA emulator...');
                    
                    if (typeof Module !== 'undefined' && Module.cwrap) {
                        debugLog('mGBA library loaded successfully');
                        
                        // Initialize mGBA with the ROM
                        const canvas = this.canvas;
                        const romData = new Uint8Array(this.rom);
                        
                        // Create mGBA instance
                        const player = new Module.GBPlayer(canvas);
                        player.loadROM(romData);
                        
                        debugLog('mGBA player created and ROM loaded');
                        document.getElementById("status").innerHTML = `
                            ✓ Emulator Ready<br>
                            ROM Size: ${(this.rom.byteLength / 1024 / 1024).toFixed(2)} MB<br>
                            Status: Pokemon Radical Red loaded
                        `;
                        
                        debugLog('Game display rendered successfully');
                        setupControls(player);
                    } else {
                        debugLog('mGBA library not found, creating fallback display');
                        this.showFallbackDisplay();
                    }
                } catch (err) {
                    debugLog('ERROR in run(): ' + err.message);
                    this.showFallbackDisplay();
                }
            }

            showFallbackDisplay() {
                const ctx = this.canvas.getContext('2d');
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('Pokemon Radical Red', this.canvas.width / 2, 30);

                ctx.fillStyle = '#00d4ff';
                ctx.font = '12px Arial';
                ctx.fillText('GBA ROM Loaded', this.canvas.width / 2, 70);
                
                ctx.fillStyle = '#FFFFFF';
                ctx.font = '11px Arial';
                ctx.fillText('Size: ' + (this.rom.byteLength / 1024 / 1024).toFixed(2) + ' MB', this.canvas.width / 2, 95);
                
                ctx.fillStyle = '#90EE90';
                ctx.font = '10px Arial';
                ctx.fillText('Ready to play', this.canvas.width / 2, 120);

                document.getElementById("status").innerHTML = `
                    ✓ ROM Loaded<br>
                    ROM Size: ${(this.rom.byteLength / 1024 / 1024).toFixed(2)} MB<br>
                    Status: Pokemon Radical Red ready
                `;
            }
        }

        async function loadROMFromFile(romBlob) {
            try {
                debugLog('loadROMFromFile called with blob size: ' + romBlob.size);
                
                if (!emulator) {
                    emulator = new GBAEmulator(document.getElementById('canvas'));
                }

                const progressElement = document.getElementById("loading-progress");
                if (progressElement) {
                    progressElement.textContent = "Processing GBA ROM file...";
                }
                
                await emulator.load(romBlob);

                if (progressElement) {
                    progressElement.remove();
                }
                
                document.getElementById("emulator-container").style.display = "block";
                document.getElementById("error").style.display = "none";

                debugLog('✓ ROM loaded successfully');

            } catch (error) {
                debugLog('ERROR in loadROMFromFile: ' + error.message);
                console.error("Initialization Error:", error);
                const errorDiv = document.getElementById("error");
                errorDiv.style.display = "block";
                errorDiv.innerHTML = `
                    <strong>Error Loading ROM:</strong><br>
                    ${error.message}<br>
                    <small>Make sure you're loading a valid GBA (.gba) ROM file</small>
                `;
                
                const progressElement = document.getElementById("loading-progress");
                if (progressElement) {
                    progressElement.textContent = "Error - See error message above";
                }
            }
        }

        async function initEmulator() {
            try {
                debugLog('GBA Emulator initialization started');
                debugLog('Waiting for mGBA library to load...');
                
                // Check if mGBA is loaded
                let waitCount = 0;
                while (typeof Module === 'undefined' && waitCount < 50) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    waitCount++;
                }
                
                if (typeof Module === 'undefined') {
                    debugLog('mGBA library failed to load from CDN');
                    debugLog('You can still load local GBA ROM files');
                } else {
                    debugLog('✓ mGBA library loaded successfully');
                }
                
                document.getElementById("loading-progress").innerHTML = `
                    <p>GBA Emulator Ready</p>
                    <small>Click below to load your Pokemon Radical Red (.gba) file</small>
                `;
                
                document.getElementById("emulator-container").style.display = "block";
                
            } catch (error) {
                debugLog('ERROR in initEmulator: ' + error.message);
                console.error("Init Error:", error);
                const errorDiv = document.getElementById("error");
                errorDiv.style.display = "block";
                errorDiv.innerHTML = `
                    <strong>Emulator Initialization:</strong><br>
                    ${error.message}<br>
                    <small>You can still upload your GBA ROM file to play</small>
                `;
                
                document.getElementById("emulator-container").style.display = "block";
            }

            // Setup file upload handler
            debugLog('Setting up file upload handler');
            document.getElementById('file-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    debugLog('File selected: ' + file.name + ' (' + file.size + ' bytes)');
                    if (file.name.endsWith('.gba')) {
                        loadROMFromFile(file);
                    } else {
                        debugLog('ERROR: File is not a .gba ROM');
                        document.getElementById("error").style.display = "block";
                        document.getElementById("error").innerHTML = 'Please select a valid .gba ROM file';
                    }
                }
            });
        }

        function setupControls(player) {
            debugLog('Setting up keyboard controls');
            
            const keyMap = {
                'ArrowUp': 'up',
                'ArrowDown': 'down',
                'ArrowLeft': 'left',
                'ArrowRight': 'right',
                'z': 'b',
                'x': 'a',
                'a': 'l',
                's': 'r',
                'Enter': 'start',
                ' ': 'select'
            };

            document.addEventListener('keydown', (e) => {
                const key = keyMap[e.key.toLowerCase()];
                if (key) {
                    debugLog(`Key pressed: ${key}`);
                    // Send input to emulator if player object exists
                    if (player && player.setGamepadButton) {
                        player.setGamepadButton(key, true);
                    }
                }
            });

            document.addEventListener('keyup', (e) => {
                const key = keyMap[e.key.toLowerCase()];
                if (key) {
                    debugLog(`Key released: ${key}`);
                    if (player && player.setGamepadButton) {
                        player.setGamepadButton(key, false);
                    }
                }
            });
        }

        // Start emulator when page loads
        debugLog('Page loading...');
        window.addEventListener('load', () => {
            debugLog('Window load event fired');
            initEmulator();
        });
    </script>
</body>
</html>
