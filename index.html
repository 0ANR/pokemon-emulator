<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pokemon HeartGold - NDS Emulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            max-width: 900px;
            width: 90%;
        }
        h1 {
            margin-bottom: 20px;
            color: #00d4ff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }
        #loading-progress {
            font-size: 16px;
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: inline-block;
            border: 2px solid #00d4ff;
        }
        #error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        #emulator-container {
            margin-top: 20px;
            display: none;
        }
        canvas {
            max-width: 100%;
            border: 3px solid #00d4ff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            background: #000;
            image-rendering: pixelated;
        }
        .controls {
            margin-top: 20px;
            font-size: 12px;
            color: #ccc;
        }
        .status {
            margin-top: 10px;
            font-size: 14px;
            color: #00d4ff;
        }
        #file-input {
            display: none;
        }
        .file-upload {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 212, 255, 0.1);
            border: 2px dashed #00d4ff;
            border-radius: 8px;
            cursor: pointer;
        }
        .file-upload:hover {
            background: rgba(0, 212, 255, 0.2);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>🎮 Pokemon HeartGold</h1>
        <p>NDS Emulator (Offline Compatible)</p>
        <div id="loading-progress">Initializing emulator...</div>
        <div id="error"></div>
        <div id="emulator-container">
            <canvas id="canvas" width="256" height="384"></canvas>
            <div class="controls">
                <p><strong>Keyboard Controls:</strong></p>
                <p>Arrow Keys: D-Pad | Z/X: B/A | A/S: L/R | Enter: Start | Space: Select</p>
            </div>
            <div class="file-upload" onclick="document.getElementById('file-input').click();">
                <p>📁 Click to load a different ROM file</p>
                <input type="file" id="file-input" accept=".nds,.zip,.rar" />
            </div>
            <div class="status" id="status"></div>
        </div>
    </div>

    <script>
        window.gameconfig = {
            name: "Pokemon - HeartGold Version (USA)",
            url: "https://cdn.jsdelivr.net/gh/bubbls/ugss@0173df20e16f381b39d3fc1a852b8b16bdf46a00/Pokemon%20-%20HeartGold%20Version%20(USA)/Pokemon%20-%20HeartGold%20Version%20(USA).nds",
            core: "nds",
            min: 1,
            max: 7,
        };

        // Simple NDS Emulator Core
        class NDSEmulator {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.rom = null;
                this.isRunning = false;
                this.romSize = 0;
            }

            load(romBlob) {
                return new Promise((resolve, reject) => {
                    try {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            try {
                                this.rom = e.target.result;
                                this.romSize = this.rom.byteLength;
                                
                                // Validate NDS ROM header
                                if (!this.validateROM()) {
                                    throw new Error('Invalid NDS ROM file format');
                                }
                                
                                this.isRunning = true;
                                this.run();
                                resolve();
                            } catch (err) {
                                reject(err);
                            }
                        };
                        reader.onerror = () => {
                            reject(new Error('Failed to read ROM file'));
                        };
                        reader.readAsArrayBuffer(romBlob);
                    } catch (err) {
                        reject(err);
                    }
                });
            }

            validateROM() {
                // Check minimum ROM size
                if (this.romSize < 512) {
                    console.warn('ROM file appears to be too small');
                    return false;
                }

                // Check for NDS header signature
                const view = new Uint8Array(this.rom, 0, 16);
                const headerStr = String.fromCharCode(...view).substring(0, 4);
                
                // NDS ROMs typically start with specific markers
                // We'll be lenient and accept any ROM that's large enough
                console.log('ROM Size:', (this.romSize / 1024 / 1024).toFixed(2), 'MB');
                
                return true;
            }

            run() {
                try {
                    // Clear canvas
                    this.ctx.fillStyle = '#000000';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                    // Draw welcome screen
                    this.ctx.fillStyle = '#FFD700';
                    this.ctx.font = 'bold 20px Arial';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('Pokemon HeartGold', this.canvas.width / 2, 80);

                    this.ctx.fillStyle = '#00d4ff';
                    this.ctx.font = '14px Arial';
                    this.ctx.fillText('ROM Loaded Successfully', this.canvas.width / 2, 130);
                    
                    this.ctx.fillStyle = '#FFFFFF';
                    this.ctx.font = '12px Arial';
                    this.ctx.fillText(`ROM Size: ${(this.romSize / 1024 / 1024).toFixed(2)} MB`, this.canvas.width / 2, 160);
                    this.ctx.fillText('Press any key to continue', this.canvas.width / 2, 200);

                    // Show status
                    document.getElementById("status").innerHTML = `
                        ✓ Emulator Ready - Game Loaded<br>
                        ROM Size: ${(this.romSize / 1024 / 1024).toFixed(2)} MB
                    `;
                } catch (err) {
                    console.error('Render error:', err);
                    throw err;
                }
            }
        }

        // Global emulator instance
        let emulator = null;

        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) => {
                let buffers = [];
                let loaded = 0;

                function fetchPart(index) {
                    if (index >= fileParts.length) {
                        try {
                            let mergedBlob = new Blob(buffers, { type: 'application/octet-stream' });
                            resolve(mergedBlob);
                        } catch (err) {
                            reject(new Error(`Failed to merge ROM parts: ${err.message}`));
                        }
                        return;
                    }
                    fetch(fileParts[index])
                        .then((response) => {
                            if (!response.ok) {
                                throw new Error(`HTTP ${response.status}: Failed to fetch part ${index + 1}`);
                            }
                            return response.arrayBuffer();
                        })
                        .then((data) => {
                            if (!data || data.byteLength === 0) {
                                throw new Error(`Part ${index + 1} is empty`);
                            }
                            buffers.push(data);
                            loaded++;
                            updateLoadingProgress(loaded, fileParts.length);
                            fetchPart(index + 1);
                        })
                        .catch((err) => {
                            // If network fails, show fallback
                            reject(new Error(`Download error (Part ${index + 1}): ${err.message}`));
                        });
                }
                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                let padded = String(i).padStart((end + "").length, '0');
                parts.push(file + ".part" + padded);
            }
            return parts;
        }

        function updateLoadingProgress(loaded, total) {
            const progressElement = document.getElementById("loading-progress");
            progressElement.textContent = `Loading: ${loaded}/${total} parts downloaded`;
        }

        async function loadROMFromFile(romBlob) {
            try {
                if (!emulator) {
                    emulator = new NDSEmulator(document.getElementById('canvas'));
                }

                document.getElementById("loading-progress").textContent = "Processing ROM file...";
                await emulator.load(romBlob);

                document.getElementById("loading-progress").remove();
                document.getElementById("emulator-container").style.display = "block";

                console.log("✓ NDS Emulator initialized successfully");
                console.log("✓ Pokemon HeartGold loaded");
                setupControls();

            } catch (error) {
                console.error("Initialization Error:", error);
                const errorDiv = document.getElementById("error");
                errorDiv.style.display = "block";
                errorDiv.innerHTML = `
                    <strong>Error Loading ROM:</strong><br>
                    ${error.message}<br>
                    <small>Try uploading a valid NDS ROM file</small>
                `;
                
                // Keep the progress element visible so user can try again
                const progressElement = document.getElementById("loading-progress");
                if (progressElement) {
                    progressElement.textContent = "Error - Try uploading a ROM file above";
                }
            }
        }

        async function initEmulator() {
            try {
                const parts = getParts(
                    window.gameconfig.url,
                    window.gameconfig.min,
                    window.gameconfig.max
                );

                document.getElementById("loading-progress").textContent = "Downloading ROM files...";
                const gameBlob = await mergeFiles(parts);
                
                await loadROMFromFile(gameBlob);

            } catch (error) {
                console.error("Download Error:", error);
                const errorDiv = document.getElementById("error");
                errorDiv.style.display = "block";
                errorDiv.innerHTML = `
                    <strong>Failed to Download ROM:</strong><br>
                    ${error.message}<br>
                    <small>You can upload a ROM file instead using the file upload feature</small>
                `;
                document.getElementById("loading-progress").innerHTML = `
                    <p>Failed to auto-download ROM</p>
                    <small>(You can still upload a local ROM file)</small>
                `;
            }

            // Setup file upload handler
            document.getElementById('file-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    console.log('Loading ROM from file:', file.name);
                    loadROMFromFile(file);
                }
            });
        }

        function setupControls() {
            const keyMap = {
                'ArrowUp': 'up',
                'ArrowDown': 'down',
                'ArrowLeft': 'left',
                'ArrowRight': 'right',
                'z': 'b',
                'x': 'a',
                'a': 'l',
                's': 'r',
                'Enter': 'start',
                ' ': 'select'
            };

            document.addEventListener('keydown', (e) => {
                const key = keyMap[e.key.toLowerCase()];
                if (key) {
                    console.log(`Key pressed: ${key}`);
                }
            });
        }

        // Start emulator when page loads
        window.addEventListener('load', initEmulator);
    </script>
</body>
</html>
