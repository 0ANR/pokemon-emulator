<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pokemon HeartGold - Emulicious Emulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        h1 {
            margin-bottom: 20px;
            color: #00d4ff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }
        #loading-progress {
            font-size: 16px;
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: inline-block;
            border: 2px solid #00d4ff;
        }
        #error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        #emulator-container {
            margin-top: 20px;
            display: none;
        }
        canvas {
            max-width: 100%;
            border: 3px solid #00d4ff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>🎮 Pokemon HeartGold</h1>
        <p>Emulicious Emulator</p>
        <div id="loading-progress">Downloading ROM files...</div>
        <div id="error"></div>
        <div id="emulator-container">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <script src="https://emulicious.net/web-emulator/loader.js"></script>
    
    <script>
        window.gameconfig = {
            name: "Pokemon - HeartGold Version (USA)",
            url: "https://cdn.jsdelivr.net/gh/bubbls/ugss@0173df20e16f381b39d3fc1a852b8b16bdf46a00/Pokemon%20-%20HeartGold%20Version%20(USA)/Pokemon%20-%20HeartGold%20Version%20(USA).nds",
            core: "nds",
            min: 1,
            max: 7,
        };

        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) => {
                let buffers = [];
                let loaded = 0;

                function fetchPart(index) {
                    if (index >= fileParts.length) {
                        let mergedBlob = new Blob(buffers);
                        resolve(mergedBlob);
                        return;
                    }
                    fetch(fileParts[index])
                        .then((response) => {
                            if (!response.ok) throw new Error(`Failed to fetch part ${index + 1}`);
                            return response.arrayBuffer();
                        })
                        .then((data) => {
                            buffers.push(data);
                            loaded++;
                            updateLoadingProgress(loaded, fileParts.length);
                            fetchPart(index + 1);
                        })
                        .catch(reject);
                }
                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                let padded = String(i).padStart((end + "").length, '0');
                parts.push(file + ".part" + padded);
            }
            return parts;
        }

        function updateLoadingProgress(loaded, total) {
            const progressElement = document.getElementById("loading-progress");
            progressElement.textContent = `Loading: ${loaded}/${total} parts downloaded`;
        }

        async function initEmulator() {
            try {
                const parts = getParts(
                    window.gameconfig.url,
                    window.gameconfig.min,
                    window.gameconfig.max
                );

                document.getElementById("loading-progress").textContent = "Merging ROM files...";
                const gameBlob = await mergeFiles(parts);
                const gameUrl = URL.createObjectURL(gameBlob);

                document.getElementById("loading-progress").textContent = "Initializing Emulicious...";

                // Wait for Emulicious to load
                if (typeof Emulicious === 'undefined') {
                    throw new Error('Emulicious failed to load. Please check your internet connection.');
                }

                // Initialize Emulicious emulator
                const emulator = new Emulicious.Emulator({
                    canvas: document.getElementById('canvas'),
                    bios: null,
                    rom: gameUrl,
                    system: 'nds'
                });

                document.getElementById("loading-progress").remove();
                document.getElementById("emulator-container").style.display = "block";

                console.log("✓ Emulicious initialized successfully");
                console.log("✓ Pokemon HeartGold loaded");

            } catch (error) {
                console.error("Initialization Error:", error);
                const errorDiv = document.getElementById("error");
                errorDiv.style.display = "block";
                errorDiv.innerHTML = `
                    <strong>Error Loading Emulator:</strong><br>
                    ${error.message}<br>
                    <small>Please ensure you have a stable internet connection and try refreshing the page.</small>
                `;
                document.getElementById("loading-progress").remove();
            }
        }

        // Start emulator when page loads
        window.addEventListener('load', initEmulator);
    </script>
</body>
</html>
